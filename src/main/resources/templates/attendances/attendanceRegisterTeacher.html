<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3 class="text-center">Students</h3>
    <table class="table table-hover mt-4">
        <thead>
        <tr>
            <th>First Name</th>
            <th>First Surname</th>
            <th>Second Surname</th>
            <th>Document</th>
            <th>Email</th>
            <th>Institutional Email</th>
            <th>Phone</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.firstName}"></td>
            <td th:text="${student.firstSurname}"></td>
            <td th:text="${student.secondSurname}"></td>
            <td th:text="${student.document}"></td>
            <td th:text="${student.personalEmail}"></td>
            <td th:text="${student.institutionalEmail}"></td>
            <td th:text="${student.phone}"></td>

            <td>
                <button class="btn btn-sm btn-warning"
                        data-bs-toggle="modal"
                        th:attr="data-bs-target='#attendanceModal',
                         data-student-id=${student.id},
                         data-student-name=${student.firstName+' '+student.firstSurname}">
                    Register Attendance
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="attendanceModal" tabindex="-1" aria-labelledby="attendanceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="attendanceModalLabel">Register Attendance</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/attendances/registerByTeacher}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="student" id="studentId">
                    <div class="mb-3">
                        <label for="studentName" class="form-label">Student</label>
                        <input type="text" class="form-control" id="studentName" readonly>
                    </div>
                    <div class="form-group mb-3" id="eventsContainer">
                        <label for="events">Events</label>
                        <select id="events" name="event" class="form-control">
                            <option th:each="event : ${events}"
                                    th:value="${event.id}"
                                    th:text="${event.title}">Event title</option>
                        </select>
                    </div>

                    <!-- Contenedor del mensaje de no eventos -->
                    <div id="noEventsMessageContainer" class="d-none">
                        <p class="text-danger">This student already has attendance in all events.</p>
                    </div>

                    <div class="form-group mb-3">
                        <label for="status">Status</label>
                        <select id="status" name="status" class="form-control">
                            <option th:each="status : ${attendanceStatus}"
                                    th:value="${status}"
                                    th:text="${status}">Status</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="qualification" class="form-label">Qualification</label>
                        <input type="number" class="form-control" id="qualification" name="qualification">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" id="acceptButton" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const attendanceModal = document.getElementById('attendanceModal');
    attendanceModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const studentId = button.getAttribute('data-student-id');
        const studentName = button.getAttribute('data-student-name');

        // Actualiza los campos del modal
        document.getElementById('studentId').value = studentId;
        document.getElementById('studentName').value = studentName;

        fetch(`/attendances/filter-events`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `studentId=${studentId}`
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Response from backend:", data); // Verificar el JSON recibido
                const eventsContainer = document.getElementById('eventsContainer');
                const noEventsMessageContainer = document.getElementById('noEventsMessageContainer');
                const eventsSelect = document.getElementById('events');
                const acceptButton = document.getElementById('acceptButton');

                // Limpia el selector de eventos
                eventsSelect.innerHTML = "";

                if (data.hasEvents) {
                    eventsContainer.classList.remove('d-none');
                    noEventsMessageContainer.classList.add('d-none');
                    acceptButton.classList.remove('d-none'); // Muestra el botón de aceptar

                    data.events.forEach(event => {
                        const option = document.createElement('option');
                        option.value = event.id;
                        option.textContent = event.title;
                        eventsSelect.appendChild(option);
                    });
                } else {
                    eventsContainer.classList.add('d-none');
                    noEventsMessageContainer.classList.remove('d-none');
                    acceptButton.classList.add('d-none'); // Oculta el botón de aceptar
                }
            })
            .catch(error => {
                console.error("Error fetching events:", error);
                alert("An error occurred while fetching events. Please try again later.");
            });
    });

</script>
</body>
</html>
